# CI for Bot Hive — runs on every PR to main and on pushes to main as a backstop.
#
# Required status check: `ci`. Branch protection (HV-033) requires this check
# to pass before merging. With auto-merge enabled, bots can self-merge their
# PRs once `ci` goes green — no human review of every change.
#
# Two-job structure (HV-077):
#   - `detect` runs in ~5s, classifies the PR as source-touching or
#     coordination-metadata-only.
#   - `ci` is the required-status-check job. It always runs (so branch
#     protection always sees a pass-or-fail signal), but skips the heavy
#     toolchain (postgres, npm ci, lint, typecheck, test, build) when the
#     PR only touches hive/, docs/, tasks/, and similar agent-coordination
#     surfaces. Hive-only PRs land in seconds instead of paying a full CI cycle.

name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      source_changed: ${{ steps.scope.outputs.source_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: scope
        name: Classify PR scope
        run: |
          # Determine the changed set vs the merge-base with main. For pushes
          # to main, compare against the previous commit.
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          else
            base_sha="${{ github.event.before }}"
          fi
          if [[ -z "$base_sha" || "$base_sha" == "0000000000000000000000000000000000000000" ]]; then
            # Initial push or shallow case — assume source changed (safe default).
            echo "source_changed=true" >> "$GITHUB_OUTPUT"
            echo "Initial / shallow ref — assuming source_changed=true"
            exit 0
          fi
          changed=$(git diff --name-only "$base_sha" HEAD)
          source_changed=false
          while IFS= read -r f; do
            [[ -z "$f" ]] && continue
            case "$f" in
              hive/*|docs/*|tasks/*|README.md|CLAUDE.md|AGENTS.md|.gitattributes)
                # Coordination metadata — keep going.
                ;;
              *)
                source_changed=true
                break
                ;;
            esac
          done <<< "$changed"
          echo "source_changed=$source_changed" >> "$GITHUB_OUTPUT"
          echo "Files changed:"
          echo "$changed"
          echo "Source touched: $source_changed"

  ci:
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Postgres service runs only when source changed; it costs ~20s to spin up
    # and we don't need it for coordination-metadata-only PRs.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bot_hive_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bot_hive_test
      # CI-only secrets — not real values, just enough to satisfy build-time validation.
      BETTER_AUTH_SECRET: ci-only-not-secret-32-chars-padding
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      BETTER_AUTH_URL: http://localhost:3000

    steps:
      - name: Coordination-metadata-only PR — skipping heavy CI
        if: needs.detect.outputs.source_changed == 'false'
        run: |
          echo "::notice::This PR only touches coordination metadata (hive/, docs/, tasks/, README, AGENTS.md, etc.). Heavy CI skipped — required-check passes."

      - name: Checkout
        if: needs.detect.outputs.source_changed == 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: needs.detect.outputs.source_changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: needs.detect.outputs.source_changed == 'true'
        run: npm ci --legacy-peer-deps

      - name: Run migrations
        if: needs.detect.outputs.source_changed == 'true'
        run: npm run db:migrate

      - name: Typecheck
        if: needs.detect.outputs.source_changed == 'true'
        run: npm run typecheck

      - name: Lint
        if: needs.detect.outputs.source_changed == 'true'
        run: npm run lint

      - name: Test
        if: needs.detect.outputs.source_changed == 'true'
        run: npm run test

      - name: Build
        if: needs.detect.outputs.source_changed == 'true'
        run: npm run build
