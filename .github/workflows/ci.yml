# CI for Bot Hive — runs on every PR to main and on pushes to main as a backstop.
#
# Required status check: `ci`. Branch protection (HV-033) requires this check
# to pass before merging. With auto-merge enabled, bots can self-merge their
# PRs once `ci` goes green — no human review of every change.
#
# Note on hive/-only PRs: the swarm protocol (see hive/HIVE.md "Working in
# parallel") routes coordination metadata edits direct to main, not through
# PRs. So in practice this workflow runs only on source-code PRs. Running it
# on the rare hive-only PR is harmless — typecheck/lint/test/build all pass
# trivially since no source changed. Path filtering would be an optimization,
# not a correctness fix; deferred until CI minutes become a concern.

name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bot_hive_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bot_hive_test
      # CI-only secrets — not real values, just enough to satisfy build-time validation.
      BETTER_AUTH_SECRET: ci-only-not-secret-32-chars-padding
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      BETTER_AUTH_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run migrations
        run: npm run db:migrate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
